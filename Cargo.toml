[package]
name = "wincrust"
version = "0.5.0"
edition = "2021"
description = "Windows and macOS desktop automation over MCP. Pure Rust, single binary, seven tools, no shell."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/wincrust"
readme = "README.md"
authors = ["Nhat Vu <nhatvu148@gmail.com>"]
# Discovery on crates.io is driven by keywords and categories far more than by
# the crate name, so these carry the weight the name does not.
# Five is the cap, so "uia" gave way to "macos": it named one platform's API by
# an acronym only people already using it would search for, where the other
# names a platform this now supports.
keywords = ["mcp", "windows", "macos", "automation", "accessibility"]
categories = [
    "os::windows-apis",
    "os::macos-apis",
    "command-line-utilities",
    "accessibility",
]
# The oldest toolchain this has actually been built on, and deliberately
# conservative: the highest MSRV any dependency declares is image's 1.88, so the
# true floor is somewhere at or below that. Nothing between 1.88 and 1.96 has
# been tested, and claiming an untested floor is worse than claiming a high one -
# too high gives a clean "requires rustc 1.96", too low gives a confusing compile
# error inside a dependency. CI runs stable (1.98.0 at time of writing) and
# passes, so this cannot be above what stable provides.
rust-version = "1.96"
# An allowlist, not an exclude-list. Publishing is permanent, and an exclude
# cannot protect against a file nobody thought of - a dry run of this crate with
# `exclude` happily packaged three desktop screenshots left behind by a manual
# `observe --out` test.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# docs.rs builds on x86_64-unknown-linux-gnu by default. Neither backend's APIs
# exist there, so the docs build would fail and crates.io would show a red
# "build failed" beside a crate that is healthy on both platforms it claims.
# Pin it to the targets it actually supports; Windows stays the default because
# it is still the larger surface.
[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
default-target = "x86_64-pc-windows-msvc"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
# png only - the other decoders would bloat a binary that never reads images
image = { version = "0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "3.1.4", features = [
  "server", "macros", "schemars",
  "transport-io",                      # stdio, for local Claude Code
  "transport-streamable-http-server",  # remote, over Tailscale
  "server-side-http",
] }
schemars = "1.2.2"
axum = "0.8.9"
unicode-normalization = "0.1"

[dev-dependencies]
# Already in the tree via axum/rmcp; named here so the host-allowlist tests can
# parse authorities exactly the way rmcp does.
http = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  # PrintWindow lives under Storage::Xps, grouped with the printing APIs -
  # which is nowhere near where anyone would look for it. It is how a window
  # is rendered on demand, and the only way to capture an accelerated viewport
  # that DWM composites and a screen read therefore misses.
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_HiDpi",
  # SendInput, for the OCR fallback path only - every other action goes
  # through a UIA control pattern.
  "Win32_UI_Input_KeyboardAndMouse",
  # OCR comes from the OS. Windows.Media.Ocr ships with Windows, returns
  # word-level bounding boxes, and costs nothing in binary size - bundling
  # Tesseract or an ONNX model would undo the single-binary property that is
  # half the reason this crate exists.
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation_Collections",
  # RecognizerLanguage returns a Windows.Globalization.Language, so the method
  # is compiled out without this.
  "Globalization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
